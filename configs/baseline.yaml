# Baseline: the "current production prompt" shape -- JSON asked for in prose,
# no exclusion criteria, no structured outputs. This is what most shipped
# extraction prompts actually look like.
id: baseline
model: claude-opus-5
prompt_file: prompts/baseline.md
effort: medium
structured_output: false
thinking: false
max_tokens: 8000
pricing:
  input_per_mtok: 5.00
  output_per_mtok: 25.00
